<!-- Text is set in Arial. Arimo (metric-compatible with Arial) downloads only as a
     fallback where Arial is not installed; browsers skip it when Arial is present.
     Arimo has no 300 weight, so do not request one: Google Fonts rejects the whole URL.
     Fira Mono is the code font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
